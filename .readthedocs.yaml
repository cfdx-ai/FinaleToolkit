# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - ca-certificates
  jobs:
    post_system_dependencies:
      # Require the Ubuntu 24.04 CA bundle containing the eMudhra incident fix.
      - >-
        dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)"
        ge '20260816ubuntu0.24.04.1'
    post_create_environment:
      # Bootstrap pip with the advisory's verified wheel before installing docs.
      - >-
        python -m pip install --no-cache-dir
        "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/conf.py

python:
   install:
   - requirements: docs/requirements.txt
        
